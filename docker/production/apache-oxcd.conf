# Production Apache tweaks.

# Platforms such as Railway, Render and Fly terminate TLS at a proxy and pass
# the real client IP in X-Forwarded-For. Without this, every request appears to
# come from the proxy, which breaks rate limiting and log analysis.
RemoteIPHeader X-Forwarded-For

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Don't advertise the exact WordPress version to scanners.
Header unset X-Powered-By
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
    AddOutputFilterByType DEFLATE application/javascript application/json
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/svg+xml "access plus 1 month"
    ExpiresByType image/webp "access plus 1 month"
</IfModule>

# Never serve the things that should not be public.
<FilesMatch "^(wp-config\.php|readme\.html|license\.txt|composer\.(json|lock))$">
    Require all denied
</FilesMatch>

<DirectoryMatch "^/var/www/html/wp-content/plugins/.*/(tests|node_modules)/">
    Require all denied
</DirectoryMatch>

# xmlrpc.php is a brute-force target and nothing here uses it.
<Files "xmlrpc.php">
    Require all denied
</Files>
